version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity_news_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=antigravity-news-super-secret-production-jwt-key-2026-safe
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      - ./prisma/dev.db:/app/prisma/dev.db
      - ./public/uploads:/app/public/uploads
